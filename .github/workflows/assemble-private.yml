name: Reconstituir instaladores na release privada
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reconstituir os quatro instaladores e verificar todos os hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_transfer.py assemble --directory dist/release-transfer-output
      - name: Anexar somente os instaladores completos ao rascunho privado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.3.0 --repo cliqueprojeto/GCP-Yt-Rebalance --clobber \
            dist/release-transfer-output/gcp-yt-rebalance_0.3.0_amd64.deb \
            dist/release-transfer-output/GCP-Yt-Rebalance-0.3.0-Windows-x64-Setup.exe \
            dist/release-transfer-output/GCP-Yt-Rebalance-0.3.0-macOS-arm64.dmg \
            dist/release-transfer-output/GCP-Yt-Rebalance-0.3.0-macOS-x86_64.dmg
