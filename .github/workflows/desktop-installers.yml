name: Release — GCP Yt Rebalance
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a release no GitHub ao final dos testes
        type: boolean
        default: true
      test_youtube:
        description: Testar vídeo aberto do Blender no YouTube (depende da disponibilidade da fonte)
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, id: windows-x64, arch: x64 }
          - { runner: macos-15-intel, id: macos-intel, arch: x64 }
          - { runner: macos-15, id: macos-apple-silicon, arch: arm64 }
          - { runner: ubuntu-22.04, id: linux-amd64, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}
      - name: Versão do aplicativo
        run: echo "VERSION=$(python -c 'import sys; sys.path.insert(0,"apps/desktop"); from runtime import VERSION; print(VERSION)')" >> "$GITHUB_ENV"
      - name: Conferir tag e versão
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$VERSION"
      - name: Ferramentas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm xvfb xauth fonts-dejavu-core libxft2 libxrender1 libx11-6 xdg-utils rpm desktop-file-utils
      - name: Ferramentas macOS
        if: runner.os == 'macOS'
        run: brew list nasm >/dev/null 2>&1 || brew install nasm
      - name: Provar integridade do downloader universal macOS antes do build completo
        if: runner.os == 'macOS'
        run: python scripts/macos_downloader_probe.py
      - name: Dependências Python fixadas, runtime nativo e testes unitários
        run: |
          python scripts/prepare_ci.py --python
          python scripts/prepare_ci.py --runtime
          mkdir -p artifacts/unit-temp
          python -m unittest discover -s tests -v
      - name: Build Windows
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --distpath dist/windows --workpath build/windows apps/desktop/windows.spec
      - name: Build macOS ou Linux nativo
        if: runner.os != 'Windows'
        run: python -m PyInstaller --noconfirm --distpath dist/native --workpath build/native apps/desktop/native.spec
      - name: Verificar assinatura ad hoc do app macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts/ci
          codesign --verify --deep --strict --verbose=2 "dist/native/GCP Yt Rebalance.app" > artifacts/ci/codesign.txt 2>&1
      - name: Definir executável a testar
        run: |
          case "$RUNNER_OS" in
            Windows) echo "APP_EXE=dist/windows/GCP Yt Rebalance/GCP Yt Rebalance.exe" >> "$GITHUB_ENV" ;;
            macOS) echo "APP_EXE=dist/native/GCP Yt Rebalance.app/Contents/MacOS/GCP Yt Rebalance" >> "$GITHUB_ENV" ;;
            Linux) echo "APP_EXE=dist/native/GCP Yt Rebalance/GCP Yt Rebalance" >> "$GITHUB_ENV" ;;
          esac
      - name: Smoke offline (interface, idiomas, temas, fila, conversões, separação, legendas, downloads)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/smoke_windows.py --exe "$APP_EXE" --separation --out artifacts/v03-final-offline
          else
            python scripts/smoke_windows.py --exe "$APP_EXE" --separation --out artifacts/v03-final-offline
          fi
          python scripts/smoke_subtitles.py --exe "$APP_EXE" --fixture artifacts/v03-final-offline/fixture.mp4 --out artifacts/v03-final-subtitles
          python scripts/smoke_downloads.py --exe "$APP_EXE" --fixture artifacts/v03-final-offline/fixture.mp4 --all-modes --out artifacts/v03-final-downloads
      - name: Teste YouTube opcional, conteúdo aberto
        if: inputs.test_youtube
        run: python scripts/smoke_downloads.py --exe "$APP_EXE" --fixture artifacts/v03-final-offline/fixture.mp4 --youtube --out artifacts/v03-final-youtube
      - name: Instalador Windows e teste de instalação
        if: runner.os == 'Windows'
        run: |
          .tools/nsis-3.12/makensis.exe /V2 "/DVERSION=$VERSION" scripts/windows-installer.nsi
          python scripts/smoke_installer.py
      - name: Empacotar DMG ou DEB + RPM
        if: runner.os != 'Windows'
        run: python scripts/package_native.py
      - name: Instalar o DEB e abrir o aplicativo instalado
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y "./dist/gcp-yt-rebalance_${VERSION}_amd64.deb"
          desktop-file-validate /usr/share/applications/gcp-yt-rebalance.desktop
          mkdir -p artifacts/installed-linux
          cp artifacts/v03-final-offline/fixture.wav artifacts/installed-linux/fixture.wav
          xvfb-run -a gcp-yt-rebalance --self-test "$PWD/artifacts/installed-linux/health.json"
          python scripts/native_contract.py /opt/gcp-yt-rebalance artifacts/ci/native-payload.json --health artifacts/installed-linux/health.json --package-record artifacts/ci/package.json
          sudo apt-get remove -y gcp-yt-rebalance
      - name: Montar DMG, copiar e testar o aplicativo instalado
        if: runner.os == 'macOS'
        run: python scripts/smoke_dmg.py
      - name: Checksums dos instaladores
        run: python scripts/hash_installers.py
      - name: Guardar instaladores
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/*Setup*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
            artifacts/ci/
            artifacts/v03-final-offline/health.json
            artifacts/v03-final-offline/summary.json
            artifacts/v03-final-offline/fixture.wav
            artifacts/v03-final-subtitles/summary.json
            artifacts/v03-final-downloads/summary.json
            artifacts/v03-installer/summary.json
            artifacts/installed-linux/health.json
            artifacts/installed-macos/health.json
      - name: Diagnósticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnosticos-${{ matrix.id }}
          retention-days: 7
          path: |
            artifacts/**/*.json
            build/**/warn-*.txt

  linux-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:22.04', kind: deb }
          - { image: 'ubuntu:24.04', kind: deb }
          - { image: 'debian:12', kind: deb }
          - { image: 'debian:13', kind: deb }
          - { image: 'fedora:42', kind: rpm }
    runs-on: ubuntu-22.04
    container: ${{ matrix.image }}
    steps:
      - name: Preparar bibliotecas para as ações oficiais
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y ca-certificates libstdc++6
          else dnf install -y ca-certificates libstdc++ findutils; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-amd64
          path: package
      - name: Máquina limpa, sem Python, FFmpeg ou modelo pré-instalados
        shell: bash
        run: |
          if [ "${{ matrix.kind }}" = deb ]; then
            apt-get install -y xvfb xauth fonts-dejavu-core jq
            apt-get install -y ./package/dist/gcp-yt-rebalance_*_amd64.deb
          else
            dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth dejavu-sans-fonts jq which
            dnf install -y ./package/dist/gcp-yt-rebalance-*.x86_64.rpm
          fi
          jq -r '.files[] | select(has("sha256")) | "\(.sha256)  \(.path)"' package/artifacts/ci/native-payload.json > /tmp/rebalance-payload.sha256
          (cd /opt/gcp-yt-rebalance && sha256sum -c --quiet /tmp/rebalance-payload.sha256)
          mkdir -p /tmp/rebalance-check
          cp package/artifacts/v03-final-offline/fixture.wav /tmp/rebalance-check/fixture.wav
          timeout 300s xvfb-run -a gcp-yt-rebalance --self-test /tmp/rebalance-check/health.json
          jq -e '.status == "passed" and .gui_queue_conversion and .preferences_save_reload and .support_page' /tmp/rebalance-check/health.json
          for format in WAV PCM FLAC MP3; do
            mkdir -p "/tmp/rebalance-check/$format"
            jq -n --arg format "$format" '{source:"/tmp/rebalance-check/fixture.wav",destination:"/tmp/rebalance-check",operation:"convert",format:$format,bits:16,rate:44100,bitrate:192,threads:2,id:"0123456789abcdef0123456789abcdef"}' > "/tmp/rebalance-check/$format/request.json"
            timeout 240s "/opt/gcp-yt-rebalance/GCP Yt Rebalance" --worker "/tmp/rebalance-check/$format/request.json"
          done
          mkdir -p /tmp/rebalance-check/stems
          jq '.operation="stems" | .format="WAV"' /tmp/rebalance-check/WAV/request.json > /tmp/rebalance-check/stems/request.json
          timeout 300s "/opt/gcp-yt-rebalance/GCP Yt Rebalance" --worker /tmp/rebalance-check/stems/request.json
          if [ "${{ matrix.kind }}" = deb ]; then apt-get remove -y gcp-yt-rebalance; else dnf remove -y gcp-yt-rebalance; fi
          test ! -e /opt/gcp-yt-rebalance/_internal

  arch:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-amd64
          path: package
      - name: Construir e testar no Arch Linux oficial
        run: |
          VERSION=$(python3 -c 'import sys; sys.path.insert(0,"apps/desktop"); from runtime import VERSION; print(VERSION)')
          mkdir -p dist artifacts/arch artifacts/arch-input
          cp "package/dist/gcp-yt-rebalance_${VERSION}_amd64.deb" dist/
          cp package/artifacts/ci/native-payload.json package/artifacts/v03-final-offline/fixture.wav artifacts/arch-input/
          docker pull archlinux:base-devel
          docker run --rm --shm-size=2g -e VERSION="$VERSION" --volume "$PWD:/work" archlinux:base-devel bash /work/scripts/build_arch_ci.sh
          docker pull archlinux:base
          docker run --rm --shm-size=2g -e VERSION="$VERSION" --volume "$PWD:/work" archlinux:base bash /work/scripts/test_arch_runtime.sh
          sudo chown -R "$(id -u):$(id -g)" dist artifacts
      - name: Guardar pacote Arch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archlinux-x86_64
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.zst.sha256
            artifacts/arch/summary.json
      - name: Diagnóstico de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnosticos-archlinux
          path: artifacts/arch/

  release:
    needs: [build, linux-install, arch]
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: collected
      - name: Reunir instaladores e checksums
        run: |
          VERSION=$(python3 -c 'import sys; sys.path.insert(0,"apps/desktop"); from runtime import VERSION; print(VERSION)')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p release
          find collected -path '*/dist/*' -type f \( -name '*Setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -la release
          for name in "GCP-Yt-Rebalance-${VERSION}-Windows-x64-Setup.exe" "GCP-Yt-Rebalance-${VERSION}-macOS-arm64.dmg" \
                      "GCP-Yt-Rebalance-${VERSION}-macOS-x86_64.dmg" "gcp-yt-rebalance_${VERSION}_amd64.deb" \
                      "gcp-yt-rebalance-${VERSION}-1.x86_64.rpm" "gcp-yt-rebalance-bin-${VERSION}-1-x86_64.pkg.tar.zst"; do
            test -s "release/$name"
            (cd release && sha256sum -c "$name.sha256")
          done
          (cd release && sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS.txt)
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          NOTES="docs/release-notes/${TAG}.md"
          test -f "$NOTES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "GCP Yt Rebalance ${VERSION}" --notes-file "$NOTES" --prerelease=false --draft=false --latest
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GCP Yt Rebalance ${VERSION}" --notes-file "$NOTES" --latest release/*
          fi
