name: Instaladores internos — GCP Yt Rebalance
on:
  workflow_dispatch:
    inputs:
      include_windows:
        description: Regerar também Windows (desativado para economizar minutos ao gerar Mac/Linux)
        type: boolean
        default: false
      test_youtube:
        description: Testar vídeo aberto do Blender no YouTube (depende da disponibilidade da fonte)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Planejar apenas os alvos solicitados
        id: matrix
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          INCLUDE_WINDOWS: ${{ inputs.include_windows }}
        shell: bash
        run: |
          test "$PRIVATE_REPOSITORY" = "true"
          python3 - <<'PY'
          import json, os
          targets=[dict(runner='macos-15-intel',id='macos-intel',arch='x64'),dict(runner='macos-15',id='macos-apple-silicon',arch='arm64'),dict(runner='ubuntu-22.04',id='linux-amd64',arch='x64')]
          if os.environ['INCLUDE_WINDOWS']=='true': targets.append(dict(runner='windows-2022',id='windows-x64',arch='x64'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('value='+json.dumps(targets)+'\n')
          PY
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Exigir repositório privado para os builds internos ainda não aprovados para publicação
        env:
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: test "$PRIVATE_REPOSITORY" = "true"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}
      - name: Ferramentas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm xvfb xauth fonts-dejavu-core libxft2 libxrender1 libx11-6 xdg-utils
      - name: Ferramentas macOS
        if: runner.os == 'macOS'
        run: brew list nasm >/dev/null 2>&1 || brew install nasm
      - name: Dependências Python fixadas e runtime nativo verificado
        run: |
          python scripts/prepare_ci.py --python
          python scripts/prepare_ci.py --runtime
          mkdir -p artifacts/unit-temp
          python -m unittest discover -s tests -v
      - name: Build Windows
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --distpath dist/v0.3 --workpath build/v0.3 apps/desktop/windows.spec
      - name: Build macOS ou Linux nativo
        if: runner.os != 'Windows'
        run: python -m PyInstaller --noconfirm --distpath dist/native --workpath build/native apps/desktop/native.spec
      - name: Verificar integridade da assinatura ad hoc do app macOS
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "dist/native/GCP Yt Rebalance.app" > artifacts/ci/codesign.txt 2>&1
      - name: Definir executável a testar
        run: |
          case "$RUNNER_OS" in
            Windows) echo "APP_EXE=dist/v0.3/GCP Yt Rebalance/GCP Yt Rebalance.exe" >> "$GITHUB_ENV" ;;
            macOS) echo "APP_EXE=dist/native/GCP Yt Rebalance.app/Contents/MacOS/GCP Yt Rebalance" >> "$GITHUB_ENV" ;;
            Linux) echo "APP_EXE=dist/native/GCP Yt Rebalance/GCP Yt Rebalance" >> "$GITHUB_ENV" ;;
          esac
      - name: Smoke offline, preferências e legendas
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/smoke_windows.py --exe "$APP_EXE" --separation --out artifacts/v03-final-offline
          else
            python scripts/smoke_windows.py --exe "$APP_EXE" --separation --out artifacts/v03-final-offline
          fi
          python scripts/smoke_subtitles.py --exe "$APP_EXE" --fixture artifacts/v03-final-offline/fixture.mp4 --out artifacts/v03-final-subtitles
          python scripts/smoke_downloads.py --exe "$APP_EXE" --fixture artifacts/v03-final-offline/fixture.mp4 --all-modes --out artifacts/v03-final-downloads
      - name: Teste YouTube opcional, conteúdo aberto
        if: inputs.test_youtube
        run: python scripts/smoke_downloads.py --exe "$APP_EXE" --fixture artifacts/v03-final-offline/fixture.mp4 --youtube --out artifacts/v03-final-youtube
      - name: Instalador Windows e teste de instalação
        if: runner.os == 'Windows'
        run: |
          .tools/nsis-3.12/makensis.exe /V2 scripts/windows-installer.nsi
          python scripts/smoke_installer.py
      - name: Empacotar DMG ou DEB
        if: runner.os != 'Windows'
        run: python scripts/package_native.py
      - name: Instalar o DEB e abrir o aplicativo instalado
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/gcp-yt-rebalance_0.3.0_amd64.deb
          mkdir -p artifacts/installed-linux
          cp artifacts/v03-final-offline/fixture.wav artifacts/installed-linux/fixture.wav
          xvfb-run -a "/opt/gcp-yt-rebalance/GCP Yt Rebalance" --self-test "$PWD/artifacts/installed-linux/health.json"
          python scripts/native_contract.py /opt/gcp-yt-rebalance artifacts/ci/native-payload.json --health artifacts/installed-linux/health.json --package-record artifacts/ci/package.json
          sudo apt-get remove -y gcp-yt-rebalance
      - name: Montar DMG, copiar e testar o aplicativo instalado
        if: runner.os == 'macOS'
        run: python scripts/smoke_dmg.py
      - name: Checksums dos instaladores
        run: python scripts/hash_installers.py
      - name: Guardar instaladores para download interno
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            dist/*Setup*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.sha256
            artifacts/ci/
            artifacts/v03-final-offline/health.json
            artifacts/v03-final-offline/summary.json
            artifacts/v03-final-offline/fixture.wav
            artifacts/v03-final-subtitles/summary.json
            artifacts/v03-final-downloads/summary.json
            artifacts/v03-installer/summary.json
            artifacts/installed-linux/health.json
            artifacts/installed-macos/health.json
      - name: Diagnósticos em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnosticos-${{ matrix.id }}
          retention-days: 7
          path: |
            artifacts/**/*.json
            build/**/warn-*.txt
  linux-install:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13']
    runs-on: ubuntu-22.04
    container: ${{ matrix.image }}
    steps:
      - name: Preparar bibliotecas para as ações oficiais
        shell: bash
        run: |
          apt-get update
          apt-get install -y ca-certificates libstdc++6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-amd64
          path: package
      - name: Máquina de teste sem Python, FFmpeg ou modelo pré-instalados
        shell: bash
        run: |
          apt-get update
          apt-get install -y xvfb xauth fonts-dejavu-core jq ca-certificates
          apt-get install -y ./package/dist/gcp-yt-rebalance_0.3.0_amd64.deb
          jq -r '.files[] | select(has("sha256")) | "\(.sha256)  \(.path)"' package/artifacts/ci/native-payload.json > /tmp/rebalance-payload.sha256
          (cd /opt/gcp-yt-rebalance && sha256sum -c /tmp/rebalance-payload.sha256)
          mkdir -p /tmp/rebalance-check
          cp package/artifacts/v03-final-offline/fixture.wav /tmp/rebalance-check/fixture.wav
          timeout 240s xvfb-run -a "/opt/gcp-yt-rebalance/GCP Yt Rebalance" --self-test /tmp/rebalance-check/health.json
          jq -e '.status == "passed" and .gui_queue_conversion and .preferences_save_reload' /tmp/rebalance-check/health.json
          for format in WAV PCM FLAC MP3; do
            mkdir -p "/tmp/rebalance-check/$format"
            jq -n --arg format "$format" '{source:"/tmp/rebalance-check/fixture.wav",destination:"/tmp/rebalance-check",operation:"convert",format:$format,bits:16,rate:44100,bitrate:192,threads:2,id:"0123456789abcdef0123456789abcdef"}' > "/tmp/rebalance-check/$format/request.json"
            timeout 240s "/opt/gcp-yt-rebalance/GCP Yt Rebalance" --worker "/tmp/rebalance-check/$format/request.json"
          done
          mkdir -p /tmp/rebalance-check/stems
          jq '.operation="stems" | .format="WAV"' /tmp/rebalance-check/WAV/request.json > /tmp/rebalance-check/stems/request.json
          timeout 240s "/opt/gcp-yt-rebalance/GCP Yt Rebalance" --worker /tmp/rebalance-check/stems/request.json
          apt-get remove -y gcp-yt-rebalance
