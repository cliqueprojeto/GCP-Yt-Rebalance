name: Release — GCP Yt Rebalance
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a release no GitHub ao final dos testes
        type: boolean
        default: true
      test_youtube:
        description: Testar vídeo aberto do Blender no YouTube (depende da disponibilidade da fonte)
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rascunho da release (recebe os instaladores; não usa a cota de artefatos)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import sys; sys.path.insert(0,"apps/desktop"); from runtime import VERSION; print(VERSION)')
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            echo "Release $TAG já existe; os arquivos serão substituídos."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "GCP Yt Rebalance ${VERSION}" --notes-file "docs/release-notes/${TAG}.md"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, id: windows-x64, arch: x64 }
          - { runner: macos-15-intel, id: macos-intel, arch: x64 }
          - { runner: macos-15, id: macos-apple-silicon, arch: arm64 }
          - { runner: ubuntu-22.04, id: linux-amd64, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.arch }}
      - name: Versão do aplicativo
        run: echo "VERSION=$(python -c 'import sys; sys.path.insert(0,"apps/desktop"); from runtime import VERSION; print(VERSION)')" >> "$GITHUB_ENV"
      - name: Conferir tag e versão
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$VERSION"
      - name: Ferramentas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm xvfb xauth fonts-dejavu-core libxft2 libxrender1 libx11-6 xdg-utils rpm desktop-file-utils
      - name: Ferramentas macOS
        if: runner.os == 'macOS'
        run: brew list nasm >/dev/null 2>&1 || brew install nasm
      - name: Provar integridade do downloader universal macOS antes do build completo
        if: runner.os == 'macOS'
        run: python scripts/macos_downloader_probe.py
      - name: Dependências Python fixadas, runtime nativo e testes unitários
        run: |
          python scripts/prepare_ci.py --python
          python scripts/prepare_ci.py --runtime
          mkdir -p artifacts/unit-temp
          python -m unittest discover -s tests -v
      - name: Build Windows
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --distpath dist/windows --workpath build/windows apps/desktop/windows.spec
      - name: Build macOS ou Linux nativo
        if: runner.os != 'Windows'
        run: python -m PyInstaller --noconfirm --distpath dist/native --workpath build/native apps/desktop/native.spec
      - name: Verificar assinatura ad hoc do app macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts/ci
          codesign --verify --deep --strict --verbose=2 "dist/native/GCP Yt Rebalance.app" > artifacts/ci/codesign.txt 2>&1
      - name: Definir executável a testar
        run: |
          case "$RUNNER_OS" in
            Windows) echo "APP_EXE=dist/windows/GCP Yt Rebalance/GCP Yt Rebalance.exe" >> "$GITHUB_ENV" ;;
            macOS) echo "APP_EXE=dist/native/GCP Yt Rebalance.app/Contents/MacOS/GCP Yt Rebalance" >> "$GITHUB_ENV" ;;
            Linux) echo "APP_EXE=dist/native/GCP Yt Rebalance/GCP Yt Rebalance" >> "$GITHUB_ENV" ;;
          esac
      - name: Smoke offline (interface, idiomas, temas, fila, conversões, separação, legendas, downloads)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/smoke_windows.py --exe "$APP_EXE" --separation --out artifacts/v03-final-offline
          else
            python scripts/smoke_windows.py --exe "$APP_EXE" --separation --out artifacts/v03-final-offline
          fi
          python scripts/smoke_subtitles.py --exe "$APP_EXE" --fixture artifacts/v03-final-offline/fixture.mp4 --out artifacts/v03-final-subtitles
          python scripts/smoke_downloads.py --exe "$APP_EXE" --fixture artifacts/v03-final-offline/fixture.mp4 --all-modes --out artifacts/v03-final-downloads
      - name: Teste YouTube opcional, conteúdo aberto
        if: inputs.test_youtube
        run: python scripts/smoke_downloads.py --exe "$APP_EXE" --fixture artifacts/v03-final-offline/fixture.mp4 --youtube --out artifacts/v03-final-youtube
      - name: Instalador Windows e teste de instalação
        if: runner.os == 'Windows'
        run: |
          .tools/nsis-3.12/makensis.exe /V2 "/DVERSION=$VERSION" scripts/windows-installer.nsi
          python scripts/smoke_installer.py
      - name: Empacotar DMG ou DEB + RPM
        if: runner.os != 'Windows'
        run: python scripts/package_native.py
      - name: Instalar o DEB e abrir o aplicativo instalado
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y "./dist/gcp-yt-rebalance_${VERSION}_amd64.deb"
          desktop-file-validate /usr/share/applications/gcp-yt-rebalance.desktop
          mkdir -p artifacts/installed-linux
          cp artifacts/v03-final-offline/fixture.wav artifacts/installed-linux/fixture.wav
          xvfb-run -a gcp-yt-rebalance --self-test "$PWD/artifacts/installed-linux/health.json"
          python scripts/native_contract.py /opt/gcp-yt-rebalance artifacts/ci/native-payload.json --health artifacts/installed-linux/health.json --package-record artifacts/ci/package.json
          sudo apt-get remove -y gcp-yt-rebalance
      - name: Montar DMG, copiar e testar o aplicativo instalado
        if: runner.os == 'macOS'
        run: python scripts/smoke_dmg.py
      - name: Checksums dos instaladores
        run: python scripts/hash_installers.py
      - name: Enviar instaladores ao rascunho da release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(dist/*Setup*.exe dist/*.dmg dist/*.deb dist/*.rpm dist/*.sha256)
          test ${#files[@]} -gt 0
          if [ "$RUNNER_OS" = Linux ]; then
            mkdir -p evidence
            cp artifacts/ci/native-payload.json artifacts/v03-final-offline/fixture.wav evidence/
            (cd evidence && zip -q ../ci-evidence-linux.zip native-payload.json fixture.wav)
            files+=(ci-evidence-linux.zip)
          fi
          for attempt in 1 2 3 4; do
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}" && break
            test "$attempt" -lt 4; sleep $((attempt * 20))
          done
      - name: Diagnósticos em caso de falha
        if: failure()
        run: |
          find artifacts -name '*.json' -size -200k -print -exec tail -c 4000 {} \; 2>/dev/null || true

  linux-install:
    needs: [draft, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:22.04', kind: deb }
          - { image: 'ubuntu:24.04', kind: deb }
          - { image: 'debian:12', kind: deb }
          - { image: 'debian:13', kind: deb }
          - { image: 'fedora:42', kind: rpm }
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Baixar pacote do rascunho da release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          mkdir -p pkg/evidence
          pattern=$([ "${{ matrix.kind }}" = deb ] && echo '*_amd64.deb' || echo '*.x86_64.rpm')
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir pkg --pattern "$pattern" --pattern ci-evidence-linux.zip
          unzip -q pkg/ci-evidence-linux.zip -d pkg/evidence
      - name: Instalar e testar em ${{ matrix.image }} limpo (sem Python, FFmpeg ou modelo)
        run: docker run --rm --shm-size=2g --volume "$PWD:/work" "${{ matrix.image }}" bash /work/scripts/test_linux_package.sh "${{ matrix.kind }}"

  arch:
    needs: [draft, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Construir e testar no Arch Linux oficial
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist artifacts/arch artifacts/arch-input
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "gcp-yt-rebalance_${VERSION}_amd64.deb"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts --pattern ci-evidence-linux.zip
          unzip -q artifacts/ci-evidence-linux.zip -d artifacts/arch-input
          docker pull archlinux:base-devel
          docker run --rm --shm-size=2g -e VERSION="$VERSION" --volume "$PWD:/work" archlinux:base-devel bash /work/scripts/build_arch_ci.sh
          docker pull archlinux:base
          docker run --rm --shm-size=2g -e VERSION="$VERSION" --volume "$PWD:/work" archlinux:base bash /work/scripts/test_arch_runtime.sh
          sudo chown -R "$(id -u):$(id -g)" dist artifacts
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.pkg.tar.zst dist/*.pkg.tar.zst.sha256
      - name: Diagnóstico de falha
        if: failure()
        run: cat artifacts/arch/*.txt 2>/dev/null | tail -100 || true

  release:
    needs: [draft, build, linux-install, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Conferir instaladores, gerar SHA256SUMS e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        run: |
          VERSION="${TAG#v}"
          gh release delete-asset "$TAG" ci-evidence-linux.zip --repo "$GITHUB_REPOSITORY" --yes || true
          mkdir -p release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release --pattern '*'
          rm -f release/SHA256SUMS.txt
          for name in "GCP-Yt-Rebalance-${VERSION}-Windows-x64-Setup.exe" "GCP-Yt-Rebalance-${VERSION}-macOS-arm64.dmg" \
                      "GCP-Yt-Rebalance-${VERSION}-macOS-x86_64.dmg" "gcp-yt-rebalance_${VERSION}_amd64.deb" \
                      "gcp-yt-rebalance-${VERSION}-1.x86_64.rpm" "gcp-yt-rebalance-bin-${VERSION}-1-x86_64.pkg.tar.zst"; do
            test -s "release/$name"
            (cd release && sha256sum -c "$name.sha256")
          done
          (cd release && sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber release/SHA256SUMS.txt
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "docs/release-notes/${TAG}.md"
          if [ "$PUBLISH" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
            echo "Release publicada: $TAG"
          else
            echo "Rascunho pronto para revisão: $TAG"
          fi
